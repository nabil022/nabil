# One-click deploy on Render (render.com): a web service with a persistent disk
# for the SQLite database. Point Render at this repo with rootDir: unrot.
services:
  - type: web
    name: unrot
    runtime: node
    rootDir: unrot
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/info
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: '1'
    disk:
      name: unrot-data
      mountPath: /var/data
      sizeGB: 1
