# Builds the Unrot Android app (unrot/) and proves it runs: tests and
# typecheck, then the APK, then an Android 14 emulator installs it, grants
# Usage access, sets up a profile like a person would, checks the home screen
# shows screen time read from the phone, then saves a backup, erases the app
# and restores it through Android's own file screens, without errors.
# The APK is kept on the run's page as a plain .apk (not a zip), so a phone
# can open the download straight into the installer.
name: Unrot Android

on:
  push:
    paths:
      - 'unrot/**'
      - '.github/workflows/unrot-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unrot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: unrot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: unrot/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            unrot/android/*.gradle*
            unrot/android/app/*.gradle*
            unrot/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the app into the Android project
        run: npm run build:android

      - name: Build the APK
        working-directory: unrot/android
        env:
          # The app's permanent key: a PKCS#12 keystore in base64, kept only in
          # this repository secret (see unrot/android/signing/README.md). Its own
          # password is not a secret. Without it, the APK gets a one-off key and
          # cannot update an installed app.
          UNROT_SIGNING_KEY: ${{ secrets.UNROT_SIGNING_KEY }}
        run: |
          if [ -n "$UNROT_SIGNING_KEY" ]; then
            printf '%s' "$UNROT_SIGNING_KEY" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/unrot-signing.p12"
            export UNROT_KEYSTORE_FILE="$RUNNER_TEMP/unrot-signing.p12"
            export UNROT_KEYSTORE_PASSWORD=unrot-signing UNROT_KEY_ALIAS=unrot UNROT_KEY_PASSWORD=unrot-signing
            echo "UNROT_SIGNING=permanent" >> "$GITHUB_ENV"
            echo "Signing with the app's permanent key."
          else
            echo "UNROT_SIGNING=one-off" >> "$GITHUB_ENV"
            echo "::warning::No UNROT_SIGNING_KEY secret, so this APK is signed with a one-off key and cannot update an installed Unrot (see unrot/android/signing/README.md)."
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK and check its key
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk unrot-android.apk
          ls -l unrot-android.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          cert=$("$apksigner" verify --print-certs unrot-android.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "Signed by the certificate with SHA-256 $cert"
          if [ "$cert" = "$(cat android/signing/unrot-signing.sha256)" ]; then
            echo "That is the app's permanent key: this APK installs over earlier ones and keeps their data."
          elif [ "$UNROT_SIGNING" = "permanent" ]; then
            echo "::error::The APK is not signed with the app's permanent key (android/signing/unrot-signing.sha256)."
            exit 1
          fi

      # archive: false uploads the bare file; the artifact takes its name.
      - uses: actions/upload-artifact@v7
        with:
          path: unrot/unrot-android.apk
          archive: false
          if-no-files-found: error

  emulator:
    name: Install and run on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: unrot/scripts

      - uses: actions/download-artifact@v8
        with:
          name: unrot-android.apk

      - name: Find the APK
        run: |
          apk=$(find . -name '*.apk' | head -1)
          if [ -z "$apk" ]; then echo "::error::No APK was downloaded"; ls -laR; exit 1; fi
          [ "$apk" = ./unrot-android.apk ] || mv "$apk" unrot-android.apk
          ls -l unrot-android.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash unrot/scripts/ci-emulator.sh unrot-android.apk evidence

      - name: Check what happened on the phone
        working-directory: evidence
        run: |
          echo "--- Unrot and WebView console lines ---"
          grep -E "\[unrot\]|Capacitor/Console|AndroidRuntime" logcat.txt | grep -v "Msg: \[object Object\]" | head -80 || true
          fail=0
          if grep -q "FATAL EXCEPTION" logcat.txt; then echo "::error::The app crashed"; grep -A40 "FATAL EXCEPTION" logcat.txt; fail=1; fi
          if [ ! -s pid.txt ]; then echo "::error::The app is not running"; fail=1; fi
          if grep -E "Capacitor/Console.*(Uncaught|TypeError|ReferenceError)" logcat.txt; then echo "::error::JavaScript errors in the app"; fail=1; fi
          if ! grep -q "\[unrot\] usage access: granted=true" logcat.txt; then echo "::error::The app did not report working usage access"; fail=1; fi
          texts() { python3 -c "import re,sys; print(' | '.join(t for t in re.findall(r' text=\"([^\"]+)\"', open(sys.argv[1]).read()) if t.strip())[:2000])" "$1" 2>/dev/null || echo "(no screen dump)"; }
          echo "--- Text on the first screen ---"
          texts ui-setup.xml
          if ! grep -qi "welcome to" ui-setup.xml 2>/dev/null; then echo "::error::The app did not open on the profile setup"; fail=1; fi
          if grep -qi "try the demo" ui-setup.xml 2>/dev/null; then echo "::error::The demo is still offered"; fail=1; fi
          echo "--- Text on the home screen after setup ---"
          texts ui-home.xml
          # Headings are styled in capitals, which Android reports as rendered: match any case.
          if ! grep -qi "today so far, from your phone" ui-home.xml 2>/dev/null; then echo "::error::Home did not show today's screen time from the phone"; fail=1; fi
          if ! grep -q ", Sam" ui-home.xml 2>/dev/null; then echo "::error::Home did not greet the profile set up on the phone"; fail=1; fi
          echo "--- Text after saving a backup, erasing and restoring it ---"
          texts ui-restored.xml
          if ! grep -q ", Sam" ui-restored.xml 2>/dev/null; then echo "::error::Restoring the backup did not bring the profile back"; fail=1; fi
          # Small screenshots, printed so they can be read from the log.
          python3 -m pip install --quiet --disable-pip-version-check pillow >/dev/null 2>&1 || true
          for f in 1-setup 2-home 2-stuck 3-save-screen 4-open-screen 5-restored 5-stuck; do
            if [ -f "$f.png" ] && python3 -c "from PIL import Image; im=Image.open('$f.png').convert('RGB'); im.thumbnail((360, 800)); im.save('$f.jpg', quality=55)" 2>/dev/null; then
              echo "BEGIN-IMG $f"; base64 -w 0 "$f.jpg"; echo; echo "END-IMG $f"
            fi
          done
          if [ "$fail" = 1 ]; then exit 1; fi
          echo "The app sets up a profile on the phone, reads usage data, and backs up and restores it."

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-evidence
          path: evidence
          if-no-files-found: ignore
