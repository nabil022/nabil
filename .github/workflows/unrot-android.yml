# Builds the Unrot Android app (unrot/) and proves it runs: tests and
# typecheck, then the APK, then an Android 14 emulator installs it, grants
# Usage access, opens the demo and checks it reads usage data without errors.
# The APK is kept as a run artifact (download it from the run's page).
name: Unrot Android

on:
  push:
    paths:
      - 'unrot/**'
      - '.github/workflows/unrot-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unrot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: unrot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: unrot/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            unrot/android/*.gradle*
            unrot/android/app/*.gradle*
            unrot/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the app into the Android project
        run: npm run build:android

      - name: Build the APK
        working-directory: unrot/android
        env:
          # Optional repository secrets (see unrot/README.md). Without them the
          # APK is signed with a one-off debug key.
          UNROT_KEYSTORE_B64: ${{ secrets.UNROT_KEYSTORE_B64 }}
          UNROT_KEYSTORE_PASSWORD: ${{ secrets.UNROT_KEYSTORE_PASSWORD }}
          UNROT_KEY_ALIAS: ${{ secrets.UNROT_KEY_ALIAS }}
          UNROT_KEY_PASSWORD: ${{ secrets.UNROT_KEY_PASSWORD }}
        run: |
          if [ -n "$UNROT_KEYSTORE_B64" ]; then
            echo "$UNROT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/unrot.keystore"
            export UNROT_KEYSTORE_FILE="$RUNNER_TEMP/unrot.keystore"
            echo "Signing with the repository's private key."
          else
            echo "No signing secret set: signing with a one-off debug key."
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk unrot-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: unrot-android-apk
          path: unrot/unrot-android.apk
          if-no-files-found: error

  emulator:
    name: Install and run on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: unrot/scripts

      - uses: actions/download-artifact@v4
        with:
          name: unrot-android-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash unrot/scripts/ci-emulator.sh unrot-android.apk evidence

      - name: Check what happened on the phone
        working-directory: evidence
        run: |
          echo "--- Unrot and WebView console lines ---"
          grep -E "\[unrot\]|Capacitor/Console|AndroidRuntime" logcat.txt | grep -v "Msg: \[object Object\]" | head -80 || true
          fail=0
          if grep -q "FATAL EXCEPTION" logcat.txt; then echo "::error::The app crashed"; grep -A40 "FATAL EXCEPTION" logcat.txt; fail=1; fi
          if [ ! -s pid.txt ]; then echo "::error::The app is not running"; fail=1; fi
          if grep -E "Capacitor/Console.*(Uncaught|TypeError|ReferenceError)" logcat.txt; then echo "::error::JavaScript errors in the app"; fail=1; fi
          if ! grep -q "\[unrot\] usage access: granted=true" logcat.txt; then echo "::error::The app did not report working usage access"; fail=1; fi
          echo "--- Text on the demo home screen ---"
          python3 -c "import re,sys; print(' | '.join(t for t in re.findall(r' text=\"([^\"]+)\"', open('ui-home.xml').read()) if t.strip())[:2000])" 2>/dev/null || echo "(no screen dump)"
          # Headings are styled in capitals, which Android reports as rendered: match any case.
          if ! grep -qi "today so far, from your phone" ui-home.xml 2>/dev/null; then echo "::error::The demo home did not show today's measured screen time"; fail=1; fi
          # Small screenshots, printed so they can be read from the log.
          python3 -m pip install --quiet --disable-pip-version-check pillow >/dev/null 2>&1 || true
          for f in 1-welcome 2-demo-home; do
            if [ -f "$f.png" ] && python3 -c "from PIL import Image; im=Image.open('$f.png').convert('RGB'); im.thumbnail((360, 800)); im.save('$f.jpg', quality=55)" 2>/dev/null; then
              echo "BEGIN-IMG $f"; base64 -w 0 "$f.jpg"; echo; echo "END-IMG $f"
            fi
          done
          if [ "$fail" = 1 ]; then exit 1; fi
          echo "The app runs, reads usage data and shows it."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence
          path: evidence
          if-no-files-found: ignore
